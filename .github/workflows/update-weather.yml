name: Update Local Weather

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Kraaifontein weather
        run: |
          curl -sS -A "ComplexWeatherPortal/1.0 (https://github.com)" \
            "https://met.no" \
            -o raw_weather.json

          python3 - << 'EOF'
          import json
          from datetime import datetime, timezone, timedelta

          with open("raw_weather.json", "r", encoding="utf-8") as f:
              text = f.read()

          if not text.strip():
              raise RuntimeError("Empty response from weather API")

          raw = json.loads(text)
          first_entry = raw["properties"]["timeseries"][0]
          details = first_entry["data"]["instant"]["details"]

          sast = timezone(timedelta(hours=2))
          now_str = datetime.now(sast).strftime("%H:%M SAST")

          output = {
              "temperature": details["air_temperature"],
              "windspeed": round(details["wind_speed"] * 3.6, 1),
              "updated_at": now_str
          }

          with open("data/weather.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)
          EOF

          rm -f raw_weather.json

      - name: Commit updated weather
        run: |
          git config user.name "Complex Automation Bot"
          git config user.email "bot@://github.com"
          git add data/weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather" && git push)
