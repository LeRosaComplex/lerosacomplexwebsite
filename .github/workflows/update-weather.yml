name: Update Local Weather

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Python weather fetch
        run: |
          python3 - << 'EOF'
          import json, urllib.request
          from datetime import datetime, timezone, timedelta

          url = "https://met.no"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "LeRosaComplexPortal/1.0 (contact@lerosa.co.za)",
                  "Accept": "application/json"
              }
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              body = response.read().decode("utf-8").strip()
              if not body:
                  raise ValueError("API returned an empty body")
              raw = json.loads(body)

          details = raw["properties"]["timeseries"][0]["data"]["instant"]["details"]

          sast = timezone(timedelta(hours=2))
          now_str = datetime.now(sast).strftime("%H:%M SAST")

          output = {
              "temperature": details["air_temperature"],
              "windspeed": round(details["wind_speed"] * 3.6, 1),
              "updated_at": now_str
          }

          with open("data/weather.json", "w") as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit updated weather
        run: |
          git config user.name "Complex Automation Bot"
          git config user.email "bot@://github.com"
          git add data/weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather" && git push)
